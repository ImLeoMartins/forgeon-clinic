<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-text);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(28,36,48,.06)}.n{font-size:12px;line-height:16px;font-weight:600;color:var(--text-strong);margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--text-muted);font-family:var(--font-mono)}</style></head><body><div class="row"><div class="sw" style="flex:2.4"><div class="chip" style="background:var(--brand-gradient)"></div><div class="n">--brand-gradient</div><div class="v">135° #4F3BF5 → #8E3BF3</div></div><div class="sw"><div class="chip" style="background:var(--indigo-50)"></div><div class="n">indigo-50</div><div class="v">#EFEDFE</div></div><div class="sw"><div class="chip" style="background:var(--indigo-100)"></div><div class="n">indigo-100</div><div class="v">#DEDAFD</div></div><div class="sw"><div class="chip" style="background:var(--indigo-500)"></div><div class="n">indigo-500</div><div class="v">#4F3BF5</div></div><div class="sw"><div class="chip" style="background:var(--indigo-600)"></div><div class="n">indigo-600</div><div class="v">#3F2BDE</div></div><div class="sw"><div class="chip" style="background:var(--violet-500)"></div><div class="n">violet-500</div><div class="v">#8E3BF3</div></div></div></body></html>
