<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-text);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(28,36,48,.06)}.n{font-size:12px;line-height:16px;font-weight:600;color:var(--text-strong);margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--text-muted);font-family:var(--font-mono)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px"><div><div style="font-size:18px;line-height:28px">Olá, Marina! Sua consulta com a Dra. Ana está confirmada para quinta, 14h30.</div><div class="v" style="margin-top:6px">text-lg 18/28 · 400</div></div><div><div style="font-size:16px;line-height:24px">Hola, Javier. Te recordamos tu cita de mañana a las 10:00. ¿Confirmas?</div><div class="v" style="margin-top:6px">text-md 16/24 · 400</div><div style="font-size:14px;line-height:20px;color:var(--text-muted);margin-top:10px">Última mensagem há 3 min · lida</div><div class="v" style="margin-top:6px">text-sm 14/20 · muted</div></div></div></body></html>
