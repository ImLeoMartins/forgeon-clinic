<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-text);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(28,36,48,.06)}.n{font-size:12px;line-height:16px;font-weight:600;color:var(--text-strong);margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--text-muted);font-family:var(--font-mono)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px"><div style="border:1px solid var(--border-subtle);border-radius:12px;padding:12px"><div class="n" style="margin:0">--duration-fast · 120ms</div><div style="font-size:13px;color:var(--text-muted);margin-top:4px">hover, press, toggles</div></div><div style="border:1px solid var(--border-subtle);border-radius:12px;padding:12px"><div class="n" style="margin:0">--duration-base · 200ms</div><div style="font-size:13px;color:var(--text-muted);margin-top:4px">menus, tooltips, tabs</div></div><div style="border:1px solid var(--border-subtle);border-radius:12px;padding:12px"><div class="n" style="margin:0">--duration-slow · 320ms</div><div style="font-size:13px;color:var(--text-muted);margin-top:4px">dialogs, toasts, drawers</div></div></div><div class="v" style="margin-top:10px">--ease-standard cubic-bezier(.2,.7,.2,1) · no bounce, no spring</div></body></html>
