<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="12–16px for cards and controls; pill for badges" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-text);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(28,36,48,.06)}.n{font-size:12px;line-height:16px;font-weight:600;color:var(--text-strong);margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--text-muted);font-family:var(--font-mono)}</style></head><body><div style="display:flex;gap:20px"><div style="display:flex;flex-direction:column;gap:6px"><div style="width:76px;height:64px;background:var(--surface-subtle);border:1.5px solid var(--border-strong);border-radius:var(--radius-xs)"></div><span class="n">xs</span><span class="v">6px</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:76px;height:64px;background:var(--surface-subtle);border:1.5px solid var(--border-strong);border-radius:var(--radius-sm)"></div><span class="n">sm</span><span class="v">8px</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:76px;height:64px;background:var(--surface-subtle);border:1.5px solid var(--border-strong);border-radius:var(--radius-md)"></div><span class="n">md</span><span class="v">12px</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:76px;height:64px;background:var(--surface-subtle);border:1.5px solid var(--border-strong);border-radius:var(--radius-lg)"></div><span class="n">lg</span><span class="v">16px</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:76px;height:64px;background:var(--surface-subtle);border:1.5px solid var(--border-strong);border-radius:var(--radius-xl)"></div><span class="n">xl</span><span class="v">24px</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:76px;height:64px;background:var(--surface-subtle);border:1.5px solid var(--border-strong);border-radius:var(--radius-pill)"></div><span class="n">pill</span><span class="v">999px</span></div></div></body></html>
