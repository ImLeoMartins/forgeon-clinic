<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-text);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(28,36,48,.06)}.n{font-size:12px;line-height:16px;font-weight:600;color:var(--text-strong);margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--text-muted);font-family:var(--font-mono)}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:4px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">1·4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:8px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">2·8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:12px;height:12px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">3·12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:16px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">4·16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:20px;height:20px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">5·20</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:24px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">6·24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">8·32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:40px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">10·40</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:48px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">12·48</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:64px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">16·64</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:80px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">20·80</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:96px;background:var(--teal-100);border:1px solid var(--teal-300);border-radius:3px"></div><span class="v">24·96</span></div></div></body></html>
