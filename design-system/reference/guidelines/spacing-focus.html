<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-text);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(28,36,48,.06)}.n{font-size:12px;line-height:16px;font-weight:600;color:var(--text-strong);margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--text-muted);font-family:var(--font-mono)}</style></head><body><div style="display:flex;gap:28px;align-items:center"><button style="height:44px;padding:0 20px;border:0;border-radius:12px;background:var(--action-primary);color:#fff;font:600 15px var(--font-text);box-shadow:var(--focus-ring)">Confirmar</button><input value="Marina Souza" style="height:44px;padding:0 14px;border:1px solid var(--border-focus);border-radius:12px;font:16px var(--font-text);box-shadow:0 0 0 3px rgba(14,140,128,.18);outline:none;width:180px"><div style="display:flex;gap:10px;align-items:flex-end"><div style="width:44px;height:44px;border:1.5px dashed var(--teal-400);border-radius:10px;display:grid;place-items:center" class="v">44</div><div style="width:48px;height:48px;border:1.5px dashed var(--teal-400);border-radius:10px;display:grid;place-items:center" class="v">48</div></div></div><div class="v" style="margin-top:12px">--focus-ring: 2px surface gap + 2px teal-500 · inputs: border-focus + 3px teal halo</div></body></html>
