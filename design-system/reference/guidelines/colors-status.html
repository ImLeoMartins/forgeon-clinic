<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-text);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(28,36,48,.06)}.n{font-size:12px;line-height:16px;font-weight:600;color:var(--text-strong);margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--text-muted);font-family:var(--font-mono)}</style></head><body><div class="row" style="flex-wrap:wrap;gap:10px"><div style="display:flex;flex-direction:column;gap:4px"><span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--status-confirmed-bg);color:var(--status-confirmed);font-size:13px;font-weight:600"><span style="width:7px;height:7px;border-radius:50%;background:currentColor"></span>Confirmada</span><span class="v">--status-confirmed</span></div><div style="display:flex;flex-direction:column;gap:4px"><span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--status-pending-bg);color:var(--status-pending);font-size:13px;font-weight:600"><span style="width:7px;height:7px;border-radius:50%;background:currentColor"></span>Pendente</span><span class="v">--status-pending</span></div><div style="display:flex;flex-direction:column;gap:4px"><span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--status-cancelled-bg);color:var(--status-cancelled);font-size:13px;font-weight:600"><span style="width:7px;height:7px;border-radius:50%;background:currentColor"></span>Cancelada</span><span class="v">--status-cancelled</span></div><div style="display:flex;flex-direction:column;gap:4px"><span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:v
