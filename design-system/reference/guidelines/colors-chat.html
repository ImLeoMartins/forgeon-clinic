<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-text);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(28,36,48,.06)}.n{font-size:12px;line-height:16px;font-weight:600;color:var(--text-strong);margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--text-muted);font-family:var(--font-mono)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bubble-patient)"></div><div class="n">patient</div><div class="v">sand-0</div></div><div class="sw"><div class="chip" style="background:var(--bubble-agent)"></div><div class="n">agent (IA)</div><div class="v">teal-50</div></div><div class="sw"><div class="chip" style="background:var(--bubble-human)"></div><div class="n">human</div><div class="v">#EEF1F6</div></div><div class="sw"><div class="chip" style="background:var(--chat-wallpaper)"></div><div class="n">wallpaper</div><div class="v">sand-100</div></div><div class="sw"><div class="chip" style="background:var(--whatsapp)"></div><div class="n">whatsapp</div><div class="v">#25D366</div></div><div class="sw"><div class="chip" style="background:var(--whatsapp-text)"></div><div class="n">whatsapp text</div><div class="v">#128C4B</div></div></div></body></html>
